version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 App Router
  - React 19
  - Tailwind CSS v4
  - Framer Motion
  - Octokit
  - "@vercel/og"
  - html-to-image
routes:
  - path: /
    file: app/page.tsx
    auth_required: false
    description: Landing page to enter a GitHub username and start Wrapped generation
  - path: /[username]
    file: app/[username]/page.tsx
    auth_required: false
    description: User Wrapped results page with animated cards, share actions, and profile summary
  - path: /api/og/[username]
    file: app/api/og/[username]/route.tsx
    auth_required: false
    description: Dynamic Open Graph image endpoint for sharing a user's Wrapped preview
features:
  - name: Username Search and Navigation
    description: User can enter a GitHub handle and navigate to a personalized Wrapped page
    files:
      - app/page.tsx
      - components/UsernameInput.tsx
    entry_route: /
    user_interactions:
      - Fill the GitHub username input field
      - Submit the form with the Generate my Wrapped button
      - Get redirected to /[username]
    api_calls: []
    auth_required: false
  - name: GitHub Data Aggregation
    description: Server fetches GitHub profile and repository activity data, then computes yearly stats
    files:
      - lib/github.ts
      - lib/stats.ts
      - lib/types.ts
      - app/[username]/page.tsx
    entry_route: /[username]
    user_interactions:
      - Open a user Wrapped page
      - Wait for server-rendered cards and computed metrics to load
      - See error UI when username is invalid or rate limit is reached
    api_calls:
      - method: GET
        endpoint: https://api.github.com/users/{username}
      - method: GET
        endpoint: https://api.github.com/users/{username}/repos
      - method: GET
        endpoint: https://api.github.com/users/{username}/events/public
      - method: GET
        endpoint: https://api.github.com/repos/{owner}/{repo}/languages
      - method: GET
        endpoint: https://api.github.com/repos/{owner}/{repo}/stats/commit_activity
      - method: GET
        endpoint: https://api.github.com/repos/{owner}/{repo}/commits
    auth_required: false
  - name: Animated Wrapped Card Carousel
    description: Presents Wrapped metrics as animated cards with keyboard, button, and swipe navigation
    files:
      - components/CardCarousel.tsx
      - components/cards/CardShell.tsx
      - components/cards/TotalCommitsCard.tsx
      - components/cards/TopLanguagesCard.tsx
      - components/cards/CodingScheduleCard.tsx
      - components/cards/LongestStreakCard.tsx
      - components/cards/TopRepoCard.tsx
      - components/cards/SummaryCard.tsx
      - app/[username]/page.tsx
    entry_route: /[username]
    user_interactions:
      - Click previous and next arrow buttons
      - Use left and right keyboard arrows
      - Swipe cards horizontally on touch devices
      - Jump directly with progress dots
    api_calls: []
    auth_required: false
  - name: Social Sharing and Image Export
    description: Allows downloading the current card as PNG and sharing current page URL to social platforms
    files:
      - components/ShareButtons.tsx
      - components/CardCarousel.tsx
    entry_route: /[username]
    user_interactions:
      - Click Descargar como imagen to export current card as PNG
      - Click Compartir en Twitter to open prefilled share intent
      - Click Compartir en LinkedIn to open LinkedIn share dialog
    api_calls: []
    auth_required: false
  - name: Dynamic OG Image Generation
    description: Generates social preview image with avatar and key Wrapped metrics
    files:
      - app/api/og/[username]/route.tsx
      - public/fonts/Geist-Regular.ttf
    entry_route: /api/og/[username]
    user_interactions:
      - Share a /[username] URL in social platforms
      - Social crawler requests the dynamic OG image endpoint
      - Preview card renders with GitHub profile metrics
    api_calls:
      - method: GET
        endpoint: /api/og/{username}
      - method: GET
        endpoint: https://api.github.com/users/{username}
    auth_required: false
known_limitations:
  - issue: Commit data depth is intentionally capped per repo and pages to control latency and API usage
    location: lib/github.ts
    impact: Heavy users may see lower-than-absolute totals for year-wide commits
  - issue: Stats rely on public GitHub data only
    location: lib/github.ts
    impact: Private repositories and private contributions are excluded
  - issue: Share-to-social actions use client window.open without in-app confirmation
    location: components/ShareButtons.tsx
    impact: Popup blocking policies may prevent opening share windows in some browsers
